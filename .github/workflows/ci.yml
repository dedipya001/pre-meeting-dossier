name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dossier
          POSTGRES_PASSWORD: dossier
          POSTGRES_DB: dossier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dossier -d dossier"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dossier:dossier@localhost:5432/dossier

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Env var and secret leak check
        run: npm run security:secrets

      - name: Dependency security audit
        run: npm run security:audit

      - name: Database schema validation
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Database migration SQL check
        run: npm run db:diff

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and SQL injection tests
        run: npm test

      - name: Build
        run: npm run build
